services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: mc_server
    environment:
      - EULA=TRUE
      - TYPE=PAPER
      - VERSION=1.20.4
      - ONLINE_MODE=FALSE
      - MEMORY=4G
      - MODE=creative
      - DIFFICULTY=peaceful
      - PLUGINS=https://dev.bukkit.org/projects/dynmap/files/latest
      - ENABLE_RCON=true
      - RCON_PASSWORD=${RCON_PASSWORD}
    ports:
      - "25565:25565" # Minecraft
      - "8123:8123"   # Dynmap Web
    volumes:
      - mc_data:/data
    deploy:
      resources:
        limits:
          memory: 5.5G
        reservations:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

  bot:
    build: ./bot
    container_name: mc_telegram_bot
    depends_on:
      minecraft:
        condition: service_healthy
    ports:
      - "3000:3000" # Dashboard Web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  mc_data: